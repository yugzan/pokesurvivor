# Client IP for the AI relay (it only trusts X-Client-IP, always overwritten below).
# CF-Connecting-IP counts only when the request comes from a private-network peer,
# i.e. our own reverse proxy (Cloudflare -> apache -> here). Anyone reaching this
# port directly from the internet gets their real address, whatever they send.
geo $ps_from_proxy { default 0; 127.0.0.0/8 1; 10.0.0.0/8 1; 172.16.0.0/12 1; 192.168.0.0/16 1; }
map "$ps_from_proxy:$http_cf_connecting_ip" $ps_client_ip { "~^1:(?<ps_cf>.+)$" $ps_cf; default $remote_addr; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  charset utf-8;

  # updater.js mira version.json cada 5 min: nunca de caché.
  location = /version.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /config.js    { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.html$      { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/        { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  location ~* \.webmanifest$ { default_type application/manifest+json; types { } try_files $uri =404; }
  location ~* \.ttf$         { default_type font/ttf; types { } add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }

  # AI agents: /mcp (remote MCP) and /agent/ (game page <-> relay, SSE + POST) go to the
  # "mcp" container of the same compose network. The upstream is a variable resolved at
  # request time by Docker's DNS, so nginx still starts without that container (-> 502).
  # ^~ and = keep these out of the regex locations above (no Cache-Control from them).
  # Both answer long-lived streams (SSE; MCP may stream too): no buffering, long timeout.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  set $mcp_upstream http://mcp:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Client-IP $ps_client_ip;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 5s;

  location = /mcp     { proxy_pass $mcp_upstream; }
  location ^~ /mcp/   { proxy_pass $mcp_upstream; }
  location ^~ /agent/ { access_log off; proxy_pass $mcp_upstream; }  # stream URL carries the private sid
}
